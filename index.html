<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuickByte — Groceries Delivered</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="site-header">
  <div class="logo">🛒 QuickByte</div>
  <nav class="main-nav">
    <a href="/">Home</a><a href="#products">Shopping</a><a href="#cart">Your Card</a><a href="#checkout">Chekout</a>
  </nav>
</header>

<section class="hero">
  <h1>Fresh groceries up to 20% off</h1>
  <p class="sub">Same-day delivery <span class="badge">SALE</span> on all fruits</p>
  <button class="cta">Shop now</button>
</section>

<main id="products">
  <h2>Today's deals</h2>
  <div class="grid" id="grid"></div>
</main>

<section id="cart" class="cart">
  <h2>Your Card</h2>
  <ul id="cart-items"></ul>
  <p class="total-line">Totle: <span id="total">₹0.00</span></p>
  <button id="checkout" class="checkout-btn">Chekout</button>
  <p id="checkout-msg" class="muted"></p>
</section>

<footer class="site-footer">
  <p>(c) 2023 QuickByte Foods · All rights reserved</p>
  <p class="foot-contact">Contact: hello@quickbyte.example</p>
</footer>

<div id="bugshield-widget"></div>
<script src="/config.js"></script>
<script>
  // ONLY BugShield link on this site: the report widget. Nothing else phones home.
  if (window.BUGSHIELD_CONFIG && window.BUGSHIELD_CONFIG.host) {
    var s = document.createElement('script');
    s.src = window.BUGSHIELD_CONFIG.host.replace(/\/$/, '') + '/sdk/bugshield.js';
    s.setAttribute('data-endpoint', window.BUGSHIELD_CONFIG.host);
    s.setAttribute('data-app-id', window.BUGSHIELD_CONFIG.appId);
    s.setAttribute('data-key', window.BUGSHIELD_CONFIG.key);
    document.body.appendChild(s);
  } else {
    console.warn('[bugshield] config.js missing — widget disabled');
  }
</script>
<script src="/app.js" type="module"></script>
</body>
</html>
